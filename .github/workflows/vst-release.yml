name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 1.2.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  carp2000:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@1af05b911e8580c8c2e473a1cc10119132e06eca
    permissions:
      contents: write
    with:
      tag: carp2000-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 1af05b911e8580c8c2e473a1cc10119132e06eca
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: carp2000
      license: MIT
      about: Semi-modular synthesizer in the manner of the ARP 2600 - 3 VCOs, ring modulator, noise, ladder filter, ADSR/AR, LFO, S&H, 6-slot modulation matrix, spring reverb; mono, duophonic or 4 voices; 32 preset slots; RANDOM patch by style with undo.
      dry_run: ${{ inputs.dry_run }}
