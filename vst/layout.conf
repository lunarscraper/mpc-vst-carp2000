# carp 2000 MPC skin layout, Force-Look (1.2.0): large type, big touch targets and a colourful page of its own (gradient, light rays,
# dark panels behind the controls), arc knobs, white slider caps (the filter mixer and the envelopes are faders), big rounded buttons (LOAD, SAVE, UNDO, RANDOM)
# and option segments. One tab per README page as before; each page its name at the top left and two framed rows of
# controls = Q-Links 1-4 and 5-8. Q-Links: knobs, faders and selectors only - the on/off switches (LF, KEYBOARD) and
# the buttons are touch only, so turning a knob can never load, save or throw a sound away. The matrix takes three
# tabs, two slots each (source, destination, amount). force_look.py (vst.json "skin_post") repaints the generator's
# images and draws the #@title / #@frame / #@text lines (comments for the generator); coordinates in shadow pixels.
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=4a1d3f
theme_ink=ffffff
theme_ink_dim=ffd27a
theme_accent=ffb347
theme_lcd=1a0a1c
theme_panel=4a1d3f
theme_box=4a1d3f
theme_accent_hi=ffffff
theme_ink_faint=4a1d3f
#@look bg_top=2b1048 bg_bottom=7a2e2a glow=ff7a3c ray1=ff9f45 ray2=c2459a ray_alpha=50 panel=160616 frame=ffb347 frame_text=2a1000 title=ffffff sub=ffcf8f text=fff4e6 knob_face=3a1840 knob_rim=7a4a6a knob_track=5e3052 knob_arc=ffb347 pointer=ffffff slider_track=5e3052 slider_fill=ffb347 slider_cap=ffffff slider_cap_line=3a1840 btn=7a2f5a btn_ring=ffb347 btn_text=ffffff btn_down=ffb347 btn_down_text=2a1000 seg=4a1d3f seg_ring=9a5a7a seg_text=ffe6cc seg_on=ffb347 seg_on_ring=ffffff seg_on_text=2a1000 pill_off=4a1d3f pill_on=ffb347 pill_dot=ffffff list=1a0a1c list_ring=ffb347 opt=2e1230 opt_text=fff4e6 opt_on=ffb347 opt_on_text=2a1000

[tab VCO1]
#@title text="VCO 1" sub="CARP 2000  1.2"
#@frame x=20 y=156 w=1240 h=270 title="VCO 1"
knob cx=175 cy=240 r=52 label="COARSE" key=v1_coarse
knob cx=485 cy=240 r=51 label="FINE" key=v1_fine
enum_h cx=795 cy=240 label="" key=v1_lf sw=145 sh=68
#@text cx=795 cy=314 label="LOW FREQ" size=29
knob cx=1105 cy=240 r=52 label="FM S&H" key=v1_fm_sh
#@frame x=20 y=438 w=1240 h=262 title="FM / KEYBOARD"
knob cx=175 cy=522 r=52 label="FM ADSR" key=v1_fm_adsr
knob cx=485 cy=522 r=52 label="FM VCO2 SINE" key=v1_fm_vco2
enum_h cx=795 cy=522 label="" key=v1_kbd sw=145 sh=68
#@text cx=795 cy=596 label="KEYBOARD" size=29
knob cx=1105 cy=522 r=52 label="PORTAMENTO" key=porta
qlinks "VCO1" = v1_coarse,v1_fine,-,v1_fm_sh,v1_fm_adsr,v1_fm_vco2,-,porta

