# carp 2000 MPC skin layout: one tab per README page, 4 x 2 controls, in the order of the
# Force's eight knobs (qlinks). Controls of later phases (S&H, ring modulator, noise colour,
# reverb, LFO, matrix) are missing on purpose; their places stay free.
# r=48: Filmstrip bleibt deutlich unter 16384 px (r=60 verrutschte beim RAT auf dem Geraet).
# Rahmentitel leer: der Tab-Name steht schon in der Tableiste.
# Palette: grey panel, white print, orange accents.
style=td3
theme_bg=2b2d2f
theme_panel=3a3d40
theme_line=1c1d1e
theme_ink=f2f2f2
theme_ink_dim=b8b8b8
theme_ink_faint=6a6d70
theme_accent=f08a1c
theme_accent_hi=ffb347
theme_knob_face=1c1d1e
theme_knob_ring=000000
theme_bar=f08a1c
theme_seg_active=f08a1c
theme_seg_inactive=1c1d1e
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=141516
theme_knob_off=55585b
theme_tab_on=f08a1c
theme_tab_on_tx=111111
theme_lcd=1a1206
theme_box=232527
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=f08a1c
theme_go_off=ffb347
theme_tabs=f08a1c

[tab VCO1]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="COARSE" key=v1_coarse
knob cx=490 cy=250 r=48 label="FINE" key=v1_fine
toggle cx=790 cy=250 label="LF" key=v1_lf
knob cx=1090 cy=250 r=48 label="FM ADSR" key=v1_fm_adsr
knob cx=190 cy=530 r=48 label="FM VCO2 SINE" key=v1_fm_vco2
toggle cx=490 cy=530 label="KEYBOARD" key=v1_kbd
knob cx=790 cy=530 r=48 label="PORTAMENTO" key=porta
qlinks "VCO1" = v1_coarse,v1_fine,v1_lf,v1_fm_adsr,v1_fm_vco2,v1_kbd,porta

